<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>MR Player</title><style>body{font:16px system-ui;max-width:650px;margin:50px auto;padding:20px;background:#111;color:#eee}button,select,input{font:inherit;margin:8px;padding:8px}label{display:block;margin-top:20px}input[type=range]{width:70%}output{font-variant-numeric:tabular-nums}</style><h1>Real-time MR Player</h1><select id="tracks"></select><button id="load">Load</button><div><button id="play">Play</button><button id="pause">Pause</button></div><label>Position <input id="seek" type="range" min="0" max="1" step="0.1" value="0"> <output id="time">0:00</output></label><label>Key <input id="key" type="range" min="-7" max="7" step="1" value="0"> <output id="keyOut">0</output></label><label>Tempo <input id="tempo" type="range" min="0.85" max="1.15" step="0.01" value="1"> <output id="tempoOut">100%</output></label><label>Master volume <input id="volume" type="range" min="0" max="1" step="0.01" value="1"></label><label>MR volume <input id="mr" type="range" min="0" max="2" step="0.05" value="1"></label><label>Melody volume <input id="melody" type="range" min="0" max="2" step="0.05" value="0"></label><label>Vocal volume <input id="vocal" type="range" min="0" max="2" step="0.05" value="0"></label><p id="status">Ready</p><script>
const $=id=>document.getElementById(id), post=x=>fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)}).then(r=>r.json()), fmt=x=>`${Math.floor(x/60)}:${String(Math.floor(x%60)).padStart(2,'0')}`;
fetch('/api/tracks').then(r=>r.json()).then(xs=>xs.forEach(x=>$('tracks').add(new Option(x,x))));
$('load').onclick=async()=>{let s=await post({cmd:'load',path:$('tracks').value});$('seek').max=s.duration;$('status').textContent=s.ok?'Loaded':'Failed'};
$('play').onclick=()=>post({cmd:'play'}); $('pause').onclick=()=>post({cmd:'pause'}); $('seek').onchange=()=>post({cmd:'seek',position:+$('seek').value});
function params(){ $('keyOut').value=(+$('key').value>0?'+':'')+$('key').value; $('tempoOut').value=Math.round($('tempo').value*100)+'%'; post({cmd:'params',key:+$('key').value,tempo:+$('tempo').value,volume:+$('volume').value,mr:+$('mr').value,melody:+$('melody').value,vocal:+$('vocal').value}) }
for(const id of ['key','tempo','volume','mr','melody','vocal']) $(id).oninput=params;
setInterval(async()=>{let s=await fetch('/api/state').then(r=>r.json());if(!$('seek').matches(':active'))$('seek').value=s.position;$('time').value=`${fmt(s.position)} / ${fmt(s.duration)}`},250);
</script></html>
