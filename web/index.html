<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>MR Player</title><style>body{font:16px system-ui;max-width:650px;margin:50px auto;padding:20px;background:#111;color:#eee}button,select,input{font:inherit;margin:8px;padding:8px}label{display:block;margin-top:20px}input[type=range]{width:70%}output{font-variant-numeric:tabular-nums}#lyrics{height:4.8em;margin:28px 0;overflow:hidden;font-size:24px;text-align:center}.lyrics-track{transition:transform .35s ease}.lyric-line{height:2.4em;display:flex;align-items:center;justify-content:center}.next-line{color:#888;font-size:.8em}.lyric-word:not(:last-child){margin-right:.3em}.lyric-word{color:transparent;background:linear-gradient(90deg,#59d var(--progress),#eee var(--progress));background-clip:text;-webkit-background-clip:text}</style><h1>Real-time MR Player</h1><select id="tracks"></select><button id="load">Load</button><div><button id="play">Play</button><button id="pause">Pause</button></div><p id="lyrics"></p><label>Position <input id="seek" type="range" min="0" max="1" step="0.1" value="0"> <output id="time">0:00</output></label><label>Key <input id="key" type="range" min="-7" max="7" step="1" value="0"> <output id="keyOut">0</output></label><label>Tempo <input id="tempo" type="range" min="0.85" max="1.15" step="0.01" value="1"> <output id="tempoOut">100%</output></label><label>Master volume <input id="volume" type="range" min="0" max="1" step="0.01" value="1"></label><label>MR volume <input id="mr" type="range" min="0" max="2" step="0.05" value="1"></label><label>Melody volume <input id="melody" type="range" min="0" max="2" step="0.05" value="0"></label><label>Vocal volume <input id="vocal" type="range" min="0" max="2" step="0.05" value="0"></label><p id="status">Ready</p><script>
const $=id=>document.getElementById(id), post=x=>fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)}).then(r=>r.json()), fmt=x=>`${Math.floor(x/60)}:${String(Math.floor(x%60)).padStart(2,'0')}`;
fetch('/api/tracks').then(r=>r.json()).then(xs=>xs.forEach(x=>$('tracks').add(new Option(x,x))));
let lyrics=[], lyricIndex=-1;
$('load').onclick=async()=>{let s=await post({cmd:'load',path:$('tracks').value});lyrics=s.lyrics||[];lyricIndex=-1;$('lyrics').innerHTML='';$('seek').max=s.duration;$('status').textContent=s.ok?'Loaded':'Failed'};
$('play').onclick=()=>post({cmd:'play'}); $('pause').onclick=()=>post({cmd:'pause'}); $('seek').onchange=()=>post({cmd:'seek',position:+$('seek').value});
function params(){ $('keyOut').value=(+$('key').value>0?'+':'')+$('key').value; $('tempoOut').value=Math.round($('tempo').value*100)+'%'; post({cmd:'params',key:+$('key').value,tempo:+$('tempo').value,volume:+$('volume').value,mr:+$('mr').value,melody:+$('melody').value,vocal:+$('vocal').value}) }
for(const id of ['key','tempo','volume','mr','melody','vocal']) $(id).oninput=params;
setInterval(async()=>{let s=await fetch('/api/state').then(r=>r.json());if(!$('seek').matches(':active'))$('seek').value=s.position;$('time').value=`${fmt(s.position)} / ${fmt(s.duration)}`;let i=lyrics.findIndex(x=>s.position<x.end);if(i<0)return $('lyrics').innerHTML='';let line=lyrics[i],words=line.words.map(x=>{let p=Math.max(0,Math.min(100,(s.position-x.start)/(x.end-x.start)*100));return `<span class="lyric-word" style="--progress:${p}%">${x.text} </span>`}).join('');if(i!==lyricIndex){$('lyrics').innerHTML=`<div class="lyrics-track" style="transform:translateY(2.4em)"><div class="lyric-line">${words}</div><div class="lyric-line next-line">${lyrics[i+1]?.text||''}</div></div>`;requestAnimationFrame(()=>requestAnimationFrame(()=>$('lyrics').firstChild.style.transform='translateY(0)'));lyricIndex=i}else $('lyrics').firstChild.firstChild.innerHTML=words},100);
</script></html>
